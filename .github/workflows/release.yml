name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run full test suite before releasing
        run: |
          uv run --no-project --python ">=3.10" -m unittest discover -s tests -p "test_*.py" -v

      - name: Build release tarball and SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --python ">=3.10" installer/build_release.py --tag "${TAG}" --out-dir dist
          cd dist
          sha256sum -c SHA256SUMS

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/notebooklm-t3-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS
